<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Halaman Tidak Ditemukan | EventNev</title>
  <meta name="theme-color" content="#E1262F">
  <link rel="icon" type="image/png" href="nev-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .not-found {
      text-align: center;
      max-width: 440px;
    }
    .not-found img { width: 60px; margin: 0 auto 24px; opacity: .6; }
    .not-found .code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.06em;
      color: var(--dark-4);
      margin-bottom: 16px;
    }
    .not-found .code span { color: var(--red); }
    .not-found h1 { font-size: 1.3rem; margin-bottom: 12px; }
    .not-found p { color: var(--text-dim); margin-bottom: 28px; }
    .not-found .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="not-found">
    <img src="nev-logo.png" alt="Logo NEV">
    <div class="code">4<span>0</span>4</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Halaman yang kamu cari tidak ada atau sudah dipindahkan. Yuk kembali ke beranda.</p>
    <div class="actions">
      <a class="btn btn-red" href="index.html">Ke Beranda ↗</a>
      <a class="btn btn-outline" href="index.html#kegiatan">Lihat Kegiatan</a>
    </div>
  </div>
</body>
</html>
