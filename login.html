<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk / Daftar — EventNev</title>
  <meta name="theme-color" content="#E1262F">
  <link rel="icon" type="image/png" href="nev-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: var(--black); }
    .auth-page { width: 100%; max-width: 440px; padding: 24px; }
    .auth-brand { text-align: center; margin-bottom: 32px; }
    .auth-brand img { width: 44px; height: 44px; margin: 0 auto 12px; }
    .auth-brand h1 { font-size: 1.5rem; font-weight: 800; }
    .auth-brand p { font-size: .875rem; color: var(--text-dim); margin-top: 4px; }

    .auth-tabs {
      display: flex;
      background: var(--dark-3);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: .875rem;
      font-weight: 600;
      border-radius: calc(var(--radius-sm) - 2px);
      color: var(--text-dim);
      transition: all var(--transition);
      cursor: pointer;
    }
    .auth-tab.active { background: var(--dark-2); color: var(--text); box-shadow: var(--shadow-sm); }

    .auth-form { display: none; flex-direction: column; gap: 16px; }
    .auth-form.active { display: flex; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: .8rem; font-weight: 600; color: var(--text-dim); }
    .field input, .field select {
      background: var(--dark-3);
      border: 1.5px solid var(--dark-4);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-size: .9rem;
      font-family: var(--font);
      transition: border-color var(--transition);
      outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--red); }
    .field input::placeholder { color: var(--muted); }

    .auth-submit {
      width: 100%;
      justify-content: center;
      padding: 13px;
      font-size: .95rem;
      margin-top: 4px;
      border-radius: var(--radius-sm);
    }

    .auth-note {
      text-align: center;
      font-size: .78rem;
      color: var(--text-dim);
      margin-top: 8px;
    }
    .auth-note a { color: var(--red); font-weight: 600; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: .75rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--dark-4);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem;
      color: var(--text-dim);
      margin-bottom: 24px;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--text); }

    .auth-error {
      background: rgba(225,38,47,.1);
      border: 1px solid rgba(225,38,47,.2);
      color: var(--red-light);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: .82rem;
      display: none;
    }
    .auth-error.show { display: block; }
    .auth-success {
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.2);
      color: #4ade80;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: .82rem;
      display: none;
    }
    .auth-success.show { display: block; }

    .spinner-inline {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    .password-toggle {
      position: relative;
    }
    .password-toggle input { padding-right: 44px; width: 100%; }
    .password-toggle button {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: .9rem;
      padding: 4px;
    }
    .password-toggle button:hover { color: var(--text); }
  </style>
</head>
<body>

<div class="auth-page">
  <a class="back-link" href="index.html">← Kembali ke beranda</a>

  <div class="auth-brand">
    <img src="nev-logo.png" alt="Logo NEV">
    <h1>Event<span class="red">Nev</span></h1>
    <p>Portal kegiatan Network Evolution</p>
  </div>

  <div class="auth-tabs">
    <div class="auth-tab active" data-tab="login">Masuk</div>
    <div class="auth-tab" data-tab="register">Daftar</div>
  </div>

  <!-- LOGIN FORM -->
  <form class="auth-form active" id="loginForm" novalidate>
    <div class="auth-error" id="loginError"></div>
    <div class="auth-success" id="loginSuccess"></div>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="kamu@email.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <div class="password-toggle" style="position:relative;">
        <input type="password" id="loginPassword" placeholder="Password kamu" autocomplete="current-password" required>
        <button type="button" id="toggleLoginPass" tabindex="-1" aria-label="Tampilkan password">👁</button>
      </div>
    </div>
    <button type="submit" class="btn btn-red auth-submit" id="loginBtn">Masuk</button>
    <p class="auth-note">Belum punya akun? <span class="auth-tab-link" data-tab="register">Daftar sekarang</span></p>
  </form>

  <!-- REGISTER FORM -->
  <form class="auth-form" id="registerForm" novalidate>
    <div class="auth-error" id="registerError"></div>
    <div class="auth-success" id="registerSuccess"></div>
    <div class="field">
      <label for="regNama">Nama lengkap</label>
      <input type="text" id="regNama" placeholder="Nama kamu" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="kamu@email.com" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="regNoHp">No. HP / WhatsApp</label>
      <input type="tel" id="regNoHp" placeholder="08xxxxxxxxxx" autocomplete="tel">
    </div>
    <div class="field">
      <label for="regJenis">Jenis peserta</label>
      <select id="regJenis" required>
        <option value="">Pilih jenis peserta</option>
        <option value="Mahasiswa">Mahasiswa</option>
        <option value="Umum">Peserta Umum</option>
        <option value="Alumni">Alumni NEV</option>
      </select>
    </div>
    <div class="field">
      <label for="regPassword">Password</label>
      <div class="password-toggle">
        <input type="password" id="regPassword" placeholder="Min. 8 karakter" autocomplete="new-password" required>
        <button type="button" id="toggleRegPass" tabindex="-1" aria-label="Tampilkan password">👁</button>
      </div>
    </div>
    <div class="field">
      <label for="regConfirm">Konfirmasi password</label>
      <input type="password" id="regConfirm" placeholder="Ulangi password" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-red auth-submit" id="registerBtn">Buat Akun</button>
    <p class="auth-note">Sudah punya akun? <span class="auth-tab-link" data-tab="login">Masuk di sini</span></p>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

function toast(msg, type = "info") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.className = "toast show " + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 3500);
}

async function apiFetch(params) {
  const url = new URL(SCRIPT_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function setLoading(btn, loading) {
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span> Memproses…';
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.label || btn.textContent;
  }
}

// Tabs
function switchTab(tab) {
  document.querySelectorAll(".auth-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  document.querySelectorAll(".auth-form").forEach(f => f.classList.toggle("active", f.id === tab + "Form"));
}

document.querySelectorAll(".auth-tab, .auth-tab-link").forEach(el => {
  el.addEventListener("click", () => switchTab(el.dataset.tab));
});

// Password toggle
function initPasswordToggle(inputId, btnId) {
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if (!input || !btn) return;
  btn.addEventListener("click", () => {
    input.type = input.type === "password" ? "text" : "password";
    btn.textContent = input.type === "password" ? "👁" : "🙈";
  });
}
initPasswordToggle("loginPassword", "toggleLoginPass");
initPasswordToggle("regPassword", "toggleRegPass");

// Store label
document.querySelectorAll("button[type=submit]").forEach(btn => {
  btn.dataset.label = btn.textContent;
});

// LOGIN
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  const sucEl = document.getElementById("loginSuccess");
  const btn = document.getElementById("loginBtn");

  errEl.classList.remove("show");
  sucEl.classList.remove("show");

  if (!email || !password) {
    errEl.textContent = "Email dan password wajib diisi.";
    errEl.classList.add("show");
    return;
  }

  setLoading(btn, true);
  try {
    const data = await apiFetch({ action: "login", email, password });
    if (data.success && data.user) {
      localStorage.setItem("nevUser", JSON.stringify(data.user));
      sucEl.textContent = "Berhasil masuk! Mengalihkan…";
      sucEl.classList.add("show");
      setTimeout(() => { window.location.href = data.user.role === "admin" ? "admin.html" : "dashboard.html"; }, 800);
    } else {
      errEl.textContent = data.message || "Email atau password salah.";
      errEl.classList.add("show");
    }
  } catch {
    // Demo login untuk testing
    if (email && password.length >= 6) {
      const demoUser = { id: "demo-001", nama: "Demo User", email, role: "peserta", poin: 0 };
      localStorage.setItem("nevUser", JSON.stringify(demoUser));
      sucEl.textContent = "Demo login berhasil! Mengalihkan…";
      sucEl.classList.add("show");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 800);
    } else {
      errEl.textContent = "Gagal terhubung ke server. Pastikan konfigurasi SCRIPT_URL sudah benar.";
      errEl.classList.add("show");
    }
  } finally {
    setLoading(btn, false);
  }
});

// REGISTER
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nama = document.getElementById("regNama").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const noHp = document.getElementById("regNoHp").value.trim();
  const jenis = document.getElementById("regJenis").value;
  const password = document.getElementById("regPassword").value;
  const confirm = document.getElementById("regConfirm").value;
  const errEl = document.getElementById("registerError");
  const sucEl = document.getElementById("registerSuccess");
  const btn = document.getElementById("registerBtn");

  errEl.classList.remove("show");
  sucEl.classList.remove("show");

  if (!nama || !email || !jenis || !password) {
    errEl.textContent = "Semua field wajib diisi.";
    errEl.classList.add("show");
    return;
  }
  if (password.length < 8) {
    errEl.textContent = "Password minimal 8 karakter.";
    errEl.classList.add("show");
    return;
  }
  if (password !== confirm) {
    errEl.textContent = "Konfirmasi password tidak sesuai.";
    errEl.classList.add("show");
    return;
  }

  setLoading(btn, true);
  try {
    const data = await apiFetch({ action: "register", nama, email, noHp, jenis, password });
    if (data.success) {
      sucEl.textContent = "Akun berhasil dibuat! Silakan masuk dengan akun baru kamu.";
      sucEl.classList.add("show");
      document.getElementById("registerForm").reset();
      setTimeout(() => switchTab("login"), 2000);
    } else {
      errEl.textContent = data.message || "Pendaftaran gagal. Email mungkin sudah terdaftar.";
      errEl.classList.add("show");
    }
  } catch {
    errEl.textContent = "Gagal terhubung ke server. Pastikan konfigurasi SCRIPT_URL sudah benar.";
    errEl.classList.add("show");
  } finally {
    setLoading(btn, false);
  }
});
</script>
</body>
</html>
