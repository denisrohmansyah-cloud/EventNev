<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Us Widget — Network Evolution</title>
<style>
  :root {
    --bg-page: #0a0a0a;
    --bg-widget: #111111;
    --bg-card: #1a1a1a;
    --bg-card-hover: #222222;
    --border: #2a2a2a;
    --border-hover: #3a3a3a;
    --text-primary: #e8e8e8;
    --text-muted: #888888;
    --accent: #e1262f;
    --icon-color: #666666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-page);
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .demo-hint {
    color: #2a2a2a;
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
    user-select: none;
  }

  /* ══ WIDGET ══ */
  .find-us {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    width: 232px;
    background: var(--bg-widget);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  }

  .find-us__header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .find-us__title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--text-primary);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .find-us__line {
    flex: 1;
    height: 1px;
    background: var(--accent);
    opacity: 0.75;
  }

  .find-us__grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .find-us__card {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 9px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s, border-color 0.15s;
    min-width: 0;
  }

  .find-us__card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
  }

  .find-us__card:hover .find-us__icon { color: #c0c0c0; }

  .find-us__icon {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    color: var(--icon-color);
    transition: color 0.15s;
  }

  .find-us__info { min-width: 0; }

  .find-us__platform {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 2.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .find-us__handle {
    font-size: 7.5px;
    color: var(--text-muted);
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (max-width: 480px) {
    .find-us { bottom: 16px; right: 16px; width: 200px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .find-us__card { transition: none; }
  }
</style>
</head>
<body>

<p class="demo-hint">
  Halaman Anda<br>
  <span style="color:#1e1e1e;font-size:11px;">Widget muncul di pojok kanan bawah ↘</span>
</p>
